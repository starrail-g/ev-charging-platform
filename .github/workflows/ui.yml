name: ui

on: [push, pull_request]

jobs:
  web:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/generate_ui_tokens.py --check
      - run: python -m unittest scripts.tests.test_generate_ui_tokens dashboard.tests.server_config_test
      - run: node --test dashboard/tests/*.test.mjs
      - run: python dashboard/serve.py --check

  qt:
    runs-on: ubuntu-22.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps (no system Qt6; Qt via aqt below)
        run: sudo apt-get update && sudo apt-get install -y build-essential libgl-dev libglx-dev libegl-dev libopengl-dev libfontconfig1 libdbus-1-3 libxkbcommon0 libglib2.0-0
      - name: Install Qt 6.2.4 + Charts via aqtinstall (jammy has no qt6-charts-dev)
        run: |
          python3 -m pip install --quiet aqtinstall
          python3 -m aqt install-qt linux desktop 6.2.4 gcc_64 -m qtcharts --outputdir "$HOME/Qt"
          echo "$HOME/Qt/6.2.4/gcc_64/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$HOME/Qt/6.2.4/gcc_64/lib" >> "$GITHUB_ENV"
      - name: qmake version
        run: qmake6 --version
      - name: Configure admin-client (qmake6, no CMake)
        run: |
          mkdir -p ../build/admin-client-ci
          cd ../build/admin-client-ci
          qmake6 ../../ev-charging-platform/apps/admin-client/admin-client.pro
      - name: Build
        run: |
          cd ../build/admin-client-ci
          make -j2
      - name: Run admin client tests (offscreen)
        run: |
          cd ../build/admin-client-ci
          find . -name 'tst_launchsmoke' -o -name 'tst_loginflow' -o -name 'tst_ui' | while read -r exe; do
            echo "== $exe =="
            "$exe" -txt || exit 1
          done
